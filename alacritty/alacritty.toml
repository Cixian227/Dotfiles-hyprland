[window]
# Прозрачность (0.8 — легкая прозрачность под стиль Dracula)
opacity = 0.9
padding = { x = 10, y = 10 }

[font]
# Основной шрифт
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
size = 14.0

# ТО САМОЕ СМЕЩЕНИЕ
# Если круг всё еще "висит" снизу, попробуй поменять y на -1 или 0
offset = { x = 0, y = 1 }

[colors.primary]
background = "#282a36"
foreground = "#f8f8f2"

# Темы Dracula для Alacritty (базовые цвета)
[colors.normal]
black =   "#21222c"
red =     "#ff5555"
green =   "#50fa7b"
yellow =  "#f1fa8c"
blue =    "#bd93f9"
magenta = "#ff79c6"
cyan =    "#8be9fd"
white =   "#f8f8f2"
