monitor=DP-1,1920x1080@144,0x0,1

$terminal = alacritty
$fileManager = thunar
$menu = rofi --show drun

source = ~/.config/hypr/rules.conf

exec-once = sleep 2 && /usr/bin/waybar
exec-once = awww-daemon
exec-once = powerprofilesctl set performance
exec-once = blueman-applet
# Эта команда заставит Hyprland применить настройки из файлов GTK, которые создал nwg-look
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Material-Light-Cursors'
exec-once = hyprctl setcursor  Material-Cursors 22
exec-once = dunst

#Курсор
env = XCURSOR_SIZE,22
env = HYPRCURSOR_SIZE,22
# Принудительное использование Wayland для Qt и GTK приложений
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = NVD_BACKEND,direct
# Оптимизация для NVIDIA
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
# Чтобы в играх и браузере было меньше статтеров
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(6b6582ff) 
    col.inactive_border = rgba(3a3a3aaa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2.0

    # Делаем активное окно слегка прозрачным (94%), а неактивное — сильнее (80%)
    active_opacity = 0.94
    inactive_opacity = 0.80

    blur {
        enabled = true
        size = 8           # Немного увеличим радиус для мягкости
        passes = 3         # 3 прохода достаточно для хорошего баланса
        new_optimizations = true
        ignore_opacity = true # ОБЯЗАТЕЛЬНО, чтобы блюр не исчезал при прозрачности
        xray = false       # Если хочешь, чтобы окна "просвечивали" друг через друга, поставь true
    }
}

animations {
    enabled = yes

    # Более агрессивные кривые для ощущения скорости
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = fluent, 0.4, 0, 0.2, 1

    # Настройки (Скорость ниже = анимация быстрее)
    animation = windows, 1, 3, myBezier          # Быстрое открытие окон
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2.5, fluent, slide # Быстрое переключение рабочих столов
    animation = layers, 1, 3, fluent, fade        # Слои (Waybar, Rofi) открываются мгновенно
}


# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc {
    # Отключаем стандартные обои и логотипы (чистый запуск)
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
    # Полезно для игр: клик по рабочему столу не забирает фокус у полноэкранных окон
    always_follow_on_dnd = true
    
    # Чтобы монитор не заснул посреди матча, но просыпался от мышки
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = us, ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

$mainMod = SUPER # Sets "Windows" key as main modifier

#Wallpaper
bind = SUPER, W, exec, waypaper --random

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, G, exec, google-chrome-stable
bind = $mainMod, Escape, exec, ~/.config/hypr/powermenu.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# --- Оптимизация рендеринга ---
render {
    direct_scanout = true 
}

# --- Прочие настройки производительности ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    # Еще один полезный параметр для игр:
    always_follow_on_dnd = true
}





