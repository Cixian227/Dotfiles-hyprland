general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot  # Скриншот рабочего стола
    # Либо укажи путь к картинке: path = /home/denis/Pictures/wall.png
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3 # Больше пассов — мягче блюр
    blur_size = 8
    noise = 0.0117
}

# ПОЛЕ ВВОДА (Input Field)
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(59, 59, 75, 0.5) # Твой фиолетовый, полупрозрачный
    inner_color = rgba(31, 32, 44, 0.5) # Темный фон
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = -1 # Полностью закругленные края
    check_color = rgb(204, 136, 255) # Цвет при проверке пароля
    fail_color = rgb(255, 102, 102) # Цвет при ошибке
    placeholder_text = <span foreground="##ffffff99">Введите пароль...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

# ЧАСЫ
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# ПРИВЕТСТВИЕ
label {
    monitor =
    text = Привет, $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

